name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Upgrade npm
        run: npm i -g npm@^11.5.1

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version: $TAG"
          echo "Package version: $PKG_VERSION"

          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "❌ Tag ($TAG) não corresponde à versão do package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Abort if version already exists on npm
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          echo "Checking if $PKG_NAME@$PKG_VERSION already exists on npm..."
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "❌ $PKG_NAME@$PKG_VERSION já existe no npm. Faça bump de versão."
            exit 1
          fi

      - name: Publish (latest or beta) as restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"

          if [[ "$TAG_NAME" == *"-beta."* ]]; then
            echo "Publishing as beta dist-tag (restricted)..."
            npm publish --tag beta --access restricted
          else
            echo "Publishing as latest dist-tag (restricted)..."
            npm publish --access restricted
          fi

